<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Lumina</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <style>
      body { width: 280px; min-height: 220px; }
    </style>
  </head>
  <body>
    <div class="popup">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="28" height="28" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="1.25" />
          <circle cx="16" cy="16" r="7.5" stroke="currentColor" stroke-width="1.25" />
          <circle cx="16" cy="16" r="2.4" fill="currentColor" />
          <path d="M16 3v4.5M16 24.5V29M3 16h4.5M24.5 16H29" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
        </svg>
        <div>
          <strong>Lumina</strong>
          <span>Grok & Google Flow</span>
        </div>
      </div>
      <button id="open-panel" type="button">Ouvrir le panneau</button>
      <button id="open-imagine" type="button" class="ghost">Ouvrir grok.com/imagine</button>
      <button id="open-flow" type="button" class="ghost">Ouvrir Google Flow</button>
      <p class="hint">Windows 11 · chargez le dossier non empaqueté. La file vit dans le panneau latéral.</p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
